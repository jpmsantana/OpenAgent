name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm -T openagent npm test
      - name: Run stub CLI
        run: |
          output=$(docker compose run --rm -T openagent)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "OpenAgent CLI stub. Chat REPL is not implemented yet."
