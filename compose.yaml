services:
  openagent:
    build: .
    working_dir: /app
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAGENT_CONFIG: /app/openagent.docker.json
    volumes:
      - ./:/app
      - openagent_node_modules:/app/node_modules
    command: ["npm", "start"]

volumes:
  openagent_node_modules:
